# Tạm thời CHỈ truy cập nội bộ qua Tailscale (nip.io → 192.168.1.230).
# Lý do: đang dùng guest login + Backstage giữ token GitHub tạo được repo.
# Mở ra internet (backstage.hoanqdy.cloud) sau khi bật GitHub login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
spec:
  ingressClassName: traefik
  rules:
  - host: backstage.hoanqdy.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: backstage, port: { number: 80 } }
  - host: backstage.192.168.1.230.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: backstage, port: { number: 80 } }
